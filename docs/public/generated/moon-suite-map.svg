    <text x="764" y="320" fill="#0F172A" font-size="34" font-family="Arial, sans-serif" font-weight="800">Moontown</text>
    <text x="764" y="354" fill="#475569" font-size="20" font-family="Arial, sans-serif">Standing goals, routing, mayor,</text>
    <text x="764" y="382" fill="#475569" font-size="20" font-family="Arial, sans-serif">civic patterns, synthesis</text>
  </g>

