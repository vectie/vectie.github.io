  </g>

  <g>
    <rect x="182" y="508" width="260" height="146" rx="24" fill="#ECFDF7" stroke="#B8EBCF"/>
    <text x="214" y="560" fill="#059669" font-size="18" font-family="Arial, sans-serif" font-weight="700">Physical Boundary</text>
