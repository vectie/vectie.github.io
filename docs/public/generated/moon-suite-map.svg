    <text x="990" y="664" fill="#475569" font-size="20" font-family="Arial, sans-serif">trusted evidence dossier</text>
  </g>

  <path d="M364 299H418" stroke="#165DFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M678 299H732" stroke="#12B886" stroke-width="4" stroke-linecap="round"/>
  <path d="M992 299H1046" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
  <path d="M700 372V456" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M312 508V428C312 410 326 396 344 396H1056C1074 396 1088 410 1088 428V508" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <text x="104" y="778" fill="#334155" font-size="24" font-family="Arial, sans-serif">The product story is broad by design: durable knowledge, agent execution, town supervision, human operators, observability, robotics, and simulation-grade world models.</text>
