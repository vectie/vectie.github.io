<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="900" rx="32" fill="#F5F8FC"/>
  <rect x="56" y="56" width="1288" height="788" rx="28" fill="white" stroke="#D7E3F4"/>
  <text x="100" y="132" fill="#0F172A" font-size="46" font-family="Arial, sans-serif" font-weight="800">How the Moon Suite Fits Together</text>
  <text x="100" y="174" fill="#475569" font-size="24" font-family="Arial, sans-serif">Marketing-friendly map of books, runtimes, towns, desks, stats, robots, and world models.</text>

  <g>
    <rect x="104" y="226" width="260" height="146" rx="24" fill="#EEF5FF" stroke="#B8D0FF"/>
    <text x="136" y="278" fill="#165DFF" font-size="18" font-family="Arial, sans-serif" font-weight="700">Durable Knowledge</text>
    <text x="136" y="320" fill="#0F172A" font-size="34" font-family="Arial, sans-serif" font-weight="800">MoonBook</text>
    <text x="136" y="354" fill="#475569" font-size="20" font-family="Arial, sans-serif">Executable books, wiki memory,</text>
    <text x="136" y="382" fill="#475569" font-size="20" font-family="Arial, sans-serif">generated sites and contracts</text>
  </g>

  <g>
    <rect x="418" y="226" width="260" height="146" rx="24" fill="#EEFDF8" stroke="#B9EDD9"/>
    <text x="450" y="278" fill="#12B886" font-size="18" font-family="Arial, sans-serif" font-weight="700">Runtime + Tasks</text>
    <text x="450" y="320" fill="#0F172A" font-size="34" font-family="Arial, sans-serif" font-weight="800">MoonClaw</text>
    <text x="450" y="354" fill="#475569" font-size="20" font-family="Arial, sans-serif">Agent execution, sessions,</text>
    <text x="450" y="382" fill="#475569" font-size="20" font-family="Arial, sans-serif">jobs, artifacts, MoonCode loops</text>
