    <text x="602" y="602" fill="#0F172A" font-size="34" font-family="Arial, sans-serif" font-weight="800">Moonstat</text>
    <text x="602" y="636" fill="#475569" font-size="20" font-family="Arial, sans-serif">Proxy routing, provider control,</text>
    <text x="602" y="664" fill="#475569" font-size="20" font-family="Arial, sans-serif">usage, metrics, suite status</text>
  </g>

  <g>
